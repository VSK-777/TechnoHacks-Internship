server.port=${PORT:8080}

# Database (MySQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/vskconnect?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# JWT
jwt.secret=${JWT_SECRET:vsk-connect-ai-super-secret-key-2024-change-in-production}
jwt.expiration=86400000

# Socket.IO
socketio.port=${SOCKETIO_PORT:9092}
socketio.hostname=0.0.0.0

# Spring AI / Groq
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.api.key=${GROQ_for_LAPTOP}
groq.model=llama-3.3-70b-versatile
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.api-key=${GROQ_for_LAPTOP}
spring.ai.openai.chat.options.model=llama-3.3-70b-versatile
spring.ai.openai.chat.options.temperature=0.7

# AI Memory
ai.memory.default-limit=50

# CORS
cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}

# Actuator
management.endpoints.web.exposure.include=health
